name: Possible false positive
description: Report a definite finding that should not have failed a healthy run.
title: "[false-positive] "
labels:
  - false-positive
body:
  - type: markdown
    attributes:
      value: Remove secrets, private paths, test names, and proprietary logs. Report vulnerabilities through Private Vulnerability Reporting instead.
  - type: input
    id: version
    attributes:
      label: HonestCI version or Action reference
      placeholder: 1.0.4 or f0909172434/honest-ci@v1.0.4
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Finding code
      placeholder: HCI003_STALE_REPORT
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Why the run was healthy
      description: Include sanitized JUnit structure, config, and relevant workflow steps.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Node version
    validations:
      required: true
  - type: input
    id: producer
    attributes:
      label: Test framework and JUnit producer
      placeholder: pytest 9 with --junitxml
    validations:
      required: true
