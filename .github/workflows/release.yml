name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing protected semantic-version tag to rebuild
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_ref || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Verify release ref
        id: release
        env:
          INPUT_RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          release_ref="${INPUT_RELEASE_REF:-${GITHUB_REF_NAME}}"
          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          expected_ref="v${package_version}"
          if [[ "${release_ref}" != "${expected_ref}" ]]; then
            echo "Release ref ${release_ref} does not match package version ${package_version}." >&2
            exit 1
          fi
          echo "release_ref=${release_ref}" >> "${GITHUB_OUTPUT}"
      - run: npm ci
      - run: npm run verify
      - run: git diff --exit-code -- dist
      - run: npm audit --omit=dev
      - run: mkdir release
      - run: npm pack --ignore-scripts --pack-destination release
      - name: Write checksums
        run: cd release && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: "release/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: release/*
          if-no-files-found: error

  publish-npm:
    if: ${{ !contains(needs.build.outputs.release_ref, '-') }}
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm publish ./release/*.tgz --tag latest

  github-release:
    if: ${{ always() && needs.build.result == 'success' && (contains(needs.build.outputs.release_ref, '-') || needs.publish-npm.result == 'success') }}
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ needs.build.outputs.release_ref }}
        run: |
          flags=()
          if [[ "${RELEASE_REF}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${RELEASE_REF}" release/* "${flags[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "HonestCI ${RELEASE_REF#v}" \
            --generate-notes
          if [[ "${RELEASE_REF}" != *-* ]]; then
            release_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_REF}" --jq '.object.type + " " + .object.sha')"
            read -r object_type release_sha <<< "${release_object}"
            if [[ "${object_type}" == "tag" ]]; then
              release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${release_sha}" --jq '.object.sha')"
            fi
            release_version="${RELEASE_REF#v}"
            major_alias="v${release_version%%.*}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${major_alias}" --silent; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major_alias}" \
                -f sha="${release_sha}" -F force=true --silent
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${major_alias}" -f sha="${release_sha}" --silent
            fi
          fi
