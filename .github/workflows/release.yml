name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing immutable release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Verify release ref
        id: release
        env:
          INPUT_RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          release_ref="${INPUT_RELEASE_REF:-${GITHUB_REF_NAME}}"
          node scripts/check-release-version.mjs "${release_ref}"
          echo "release_ref=${release_ref}" >> "${GITHUB_OUTPUT}"
      - run: npm ci
      - run: npm run verify
      - run: git diff --exit-code -- dist
      - run: npm audit --omit=dev
      - run: mkdir release
      - run: npm pack --ignore-scripts --pack-destination release
      - name: Write checksums
        run: cd release && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release/*"
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: release/*
          if-no-files-found: error

  publish-npm:
    if: ${{ !contains(needs.build.outputs.release_ref, '-') }}
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: release
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm publish ./release/*.tgz --tag latest

  github-release:
    if: ${{ always() && needs.build.result == 'success' && (contains(needs.build.outputs.release_ref, '-') || needs.publish-npm.result == 'success') }}
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ needs.build.outputs.release_ref }}
        run: |
          flags=()
          if [[ "${RELEASE_REF}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${RELEASE_REF}" release/* "${flags[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "HonestCI ${RELEASE_REF#v}" \
            --generate-notes
