name: Ephemeral Candidate 25 Lean diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ephemeral-lean-diagnostic.yml'

permissions:
  contents: read

env:
  OFFICIAL_COMMIT: '2848228ff490422442878fd6f5abaf4cfa95257d'
  CERT_PATH: 'ephemeral/candidate25-generated-v2.lean'
  CERT_BYTES: '2560'
  CERT_SHA256: '249ebca4ffffe17eb36905df431b550e26a170a5212f920b39d0e3ea06367aa6'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify exact certificate binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < "$CERT_PATH")" -eq "$CERT_BYTES"
          echo "$CERT_SHA256  $CERT_PATH" | sha256sum -c -

      - uses: actions/checkout@v4
        with:
          repository: SAIRcompetition/equational-theories-lean-stage2
          ref: ${{ env.OFFICIAL_COMMIT }}
          path: official

      - name: Build pinned official environment
        shell: bash
        run: |
          set -euo pipefail
          cd official
          SKIP_DOCKER=1 bash scripts/setup.sh
          test -f .env.judge

      - name: Capture the full sanitized Judge result
        shell: bash
        run: |
          set -euo pipefail
          source official/.env.judge
          mkdir -p diagnostic-result
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'official'))
          from judge.verify import verify_answer
          problem = {
              'id': 'hard2_0027',
              'eq1_id': 1167,
              'eq2_id': 1763,
              'equation1': 'x = y ◇ ((z ◇ (y ◇ y)) ◇ x)',
              'equation2': 'x = (y ◇ z) ◇ ((x ◇ z) ◇ x)',
              'answer': False,
          }
          code = Path(os.environ['CERT_PATH']).read_text()
          result = verify_answer(problem, json.dumps({'verdict':'false','code':code}, ensure_ascii=False))
          result['run_id'] = os.environ['GITHUB_RUN_ID']
          result['official_commit'] = os.environ['OFFICIAL_COMMIT']
          result['certificate_sha256'] = os.environ['CERT_SHA256']
          Path('diagnostic-result/result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          print(result.get('status'), result.get('error_code'))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate25-lean-diagnostic-${{ github.run_id }}
          path: diagnostic-result/result.json
          if-no-files-found: warn
          retention-days: 1
