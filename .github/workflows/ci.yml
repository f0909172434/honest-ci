name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify test execution evidence with HonestCI
        id: honest-ci
        uses: ./
        with:
          command: npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
          config: honest-ci.yml
          github-token: ${{ github.token }}
          evidence-output: .honest-ci/evidence.json
      - name: Verify evidence output
        shell: bash
        run: test "${{ steps.honest-ci.outputs.evidence-path }}" = ".honest-ci/evidence.json" && test -f .honest-ci/evidence.json
      - name: Upload HonestCI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: honest-ci-evidence-${{ matrix.os }}-${{ matrix.node }}
          path: .honest-ci/evidence.json
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- dist
      - run: npm pack --dry-run
