name: Ephemeral Candidate 25 official Lean gate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ephemeral-actions-probe.yml'

permissions:
  contents: read

concurrency:
  group: ephemeral-candidate25-official-gate
  cancel-in-progress: false

env:
  OFFICIAL_COMMIT: '2848228ff490422442878fd6f5abaf4cfa95257d'
  CERT_BYTES: '637'
  CERT_SHA256: '6e49699df01606d154b1aae4cb85a03acf3563fa153805637d422667fe1a5903'
  PAYLOAD_BRANCH: 'agent/ephemeral-actions-probe'

jobs:
  official-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Generate a one-time in-run transport key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p transport
          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out /tmp/candidate25-private.pem
          openssl pkey \
            -in /tmp/candidate25-private.pem \
            -pubout \
            -out transport/public.pem
          sha256sum transport/public.pem > transport/public.sha256
          printf '%s\n' "$GITHUB_RUN_ID" > transport/run-id.txt

      - uses: actions/upload-artifact@v4
        with:
          name: candidate25-one-time-public-key-${{ github.run_id }}
          path: transport/
          if-no-files-found: error
          retention-days: 1

      - name: Receive and decrypt the run-bound certificate payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          payload_path="ephemeral/candidate25-payload-${GITHUB_RUN_ID}.json"
          received=0
          for attempt in $(seq 1 240); do
            git fetch --quiet origin "$PAYLOAD_BRANCH"
            if git show "FETCH_HEAD:${payload_path}" > /tmp/candidate25-payload.json 2>/dev/null; then
              received=1
              break
            fi
            sleep 5
          done
          test "$received" -eq 1
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(Path('/tmp/candidate25-payload.json').read_text(encoding='utf-8'))
          if str(payload.get('run_id')) != os.environ['GITHUB_RUN_ID']:
              raise SystemExit('payload run binding mismatch')
          encrypted_key = base64.b64decode(payload['encrypted_key_b64'], validate=True)
          ciphertext = base64.b64decode(payload['ciphertext_b64'], validate=True)
          Path('/tmp/candidate25-key.enc').write_bytes(encrypted_key)
          subprocess.run(
              [
                  'openssl', 'pkeyutl', '-decrypt',
                  '-inkey', '/tmp/candidate25-private.pem',
                  '-in', '/tmp/candidate25-key.enc',
                  '-out', '/tmp/candidate25-key.bin',
                  '-pkeyopt', 'rsa_padding_mode:oaep',
                  '-pkeyopt', 'rsa_oaep_md:sha256',
              ],
              check=True,
          )
          key = Path('/tmp/candidate25-key.bin').read_bytes()
          if len(key) != 32:
              raise SystemExit('transport key length mismatch')
          stream = bytearray()
          for counter in range((len(ciphertext) + 31) // 32):
              stream.extend(hashlib.sha256(key + counter.to_bytes(8, 'big')).digest())
          certificate = bytes(left ^ right for left, right in zip(ciphertext, stream))
          if len(certificate) != int(os.environ['CERT_BYTES']):
              raise SystemExit('certificate byte count mismatch')
          if hashlib.sha256(certificate).hexdigest() != os.environ['CERT_SHA256']:
              raise SystemExit('certificate digest mismatch')
          Path('/tmp/candidate25-certificate.lean').write_bytes(certificate)
          PY

      - name: Check out the pinned official evaluator
        uses: actions/checkout@v4
        with:
          repository: SAIRcompetition/equational-theories-lean-stage2
          ref: ${{ env.OFFICIAL_COMMIT }}
          path: official

      - name: Build the pinned official Lean environment
        shell: bash
        run: |
          set -euo pipefail
          cd official
          SKIP_DOCKER=1 bash scripts/setup.sh
          test -f .env.judge

      - name: Require official accepted false verdict
        shell: bash
        run: |
          set -euo pipefail
          source official/.env.judge
          mkdir -p gate-result
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / 'official'))
          from judge.verify import verify_answer

          problem = {
              'id': 'hard2_0027',
              'eq1_id': 1167,
              'eq2_id': 1763,
              'equation1': 'x = y ◇ ((z ◇ (y ◇ y)) ◇ x)',
              'equation2': 'x = (y ◇ z) ◇ ((x ◇ z) ◇ x)',
              'answer': False,
          }
          code = Path('/tmp/candidate25-certificate.lean').read_text(encoding='utf-8')
          result = verify_answer(
              problem,
              json.dumps({'verdict': 'false', 'code': code}, ensure_ascii=False),
          )
          public_result = {
              'record_type': 'candidate25_ephemeral_official_lean_gate',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'official_commit': os.environ['OFFICIAL_COMMIT'],
              'certificate_bytes': int(os.environ['CERT_BYTES']),
              'certificate_sha256': os.environ['CERT_SHA256'],
              'status': result.get('status'),
              'verdict': result.get('verdict'),
              'error_code': result.get('error_code'),
              'axioms': result.get('axioms', []),
              'direct_declarations': result.get('direct_declarations', []),
              'passed': result.get('status') == 'accepted' and result.get('verdict') == 'false',
          }
          Path('gate-result/result.json').write_text(
              json.dumps(public_result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(public_result, sort_keys=True))
          if not public_result['passed']:
              print(result.get('stderr', ''), file=sys.stderr)
              raise SystemExit('pinned official Judge did not accept the False certificate')
          PY

      - name: Erase all one-time plaintext and private material
        if: always()
        shell: bash
        run: |
          rm -rf transport
          rm -f \
            /tmp/candidate25-private.pem \
            /tmp/candidate25-payload.json \
            /tmp/candidate25-key.enc \
            /tmp/candidate25-key.bin \
            /tmp/candidate25-certificate.lean

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate25-ephemeral-official-gate-${{ github.run_id }}
          path: gate-result/result.json
          if-no-files-found: warn
          retention-days: 7
