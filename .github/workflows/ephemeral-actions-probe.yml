name: Ephemeral public runner probe

on:
  push:
    branches:
      - agent/ephemeral-actions-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        run: |
          set -euo pipefail
          echo "runner-started"
          python --version
          uname -a
